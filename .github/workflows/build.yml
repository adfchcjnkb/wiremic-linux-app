name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-5compat-dev \
            libopus-dev libssl-dev nlohmann-json3-dev \
            libpipewire-0.3-dev libpulse-dev \
            fuse libfuse2 wget file

      - name: Configure
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DWIREMIC_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build --target wiremic -j"$(nproc)"

      - name: Package AppImage
        run: |
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/latest/download/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/applications
          cp build/linux-app/wiremic AppDir/usr/bin/wiremic
          cp linux-app/resources/icons/app_icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/wiremic.svg

          cat > AppDir/usr/share/applications/wiremic.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=WireMic
          Comment=Wireless microphone receiver
          Exec=wiremic
          Icon=wiremic
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF

          export QML_SOURCES_PATHS=linux-app/src/ui
          export NO_STRIP=1
          ./linuxdeploy --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/wiremic.desktop \
            --icon-file linux-app/resources/icons/app_icon.svg

          mkdir -p dist
          mv WireMic*.AppImage dist/WireMic-x86_64.AppImage || mv wiremic*.AppImage dist/WireMic-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: wiremic-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wiremic-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
