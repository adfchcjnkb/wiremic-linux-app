name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  WIREMIC_VERSION: "1.0.0"

jobs:
  build-linux:
    name: Linux (deb, rpm, tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-5compat-dev \
            libopus-dev libssl-dev nlohmann-json3-dev \
            libpipewire-0.3-dev libpulse-dev \
            rpm file

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DWIREMIC_BUILD_TESTS=ON .

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package
        working-directory: build
        run: |
          cpack -G "TGZ;DEB;RPM"
          mkdir -p ../dist
          mv wiremic-*.tar.gz wiremic-*.deb wiremic-*.rpm ../dist/

      - name: Show package contents
        run: |
          echo "--- deb ---"; dpkg-deb -c dist/wiremic-*.deb | awk '{print $6}'
          echo "--- rpm ---"; rpm -qlp dist/wiremic-*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: wiremic-linux-packages
          path: dist/*
          if-no-files-found: error

  build-arch:
    name: Linux (Arch pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja qt6-base qt6-svg opus openssl \
            libpipewire libpulse nlohmann-json

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          # makepkg refuses to run as root, so build as an unprivileged user
          # straight from the checkout rather than a release tarball.
          useradd -m builder
          cp packaging/linux/PKGBUILD /home/builder/
          chown -R builder:builder /home/builder "$GITHUB_WORKSPACE"
          su builder -c "
            cd /home/builder
            sed -i 's|^source=.*|source=()|; s|^sha256sums=.*|sha256sums=()|' PKGBUILD
            sed -i 's|cd \"\\\$srcdir/wiremic-linux-app-\\\$pkgver\"|cd $GITHUB_WORKSPACE|g' PKGBUILD
            makepkg -f --noconfirm --nocheck
          "
          mkdir -p dist && cp /home/builder/*.pkg.tar.zst dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wiremic-arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  build-windows:
    name: Windows (exe + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Install vcpkg dependencies
        shell: pwsh
        run: vcpkg install opus:x64-windows openssl:x64-windows nlohmann-json:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DWIREMIC_BUILD_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            .

      - name: Build
        run: cmake --build build --config Release -j

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/app | Out-Null
          Copy-Item build/linux-app/Release/wiremic.exe dist/app/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations dist/app/wiremic.exe

      - name: Fetch VB-CABLE for bundling
        shell: pwsh
        continue-on-error: true
        run: |
          # VB-Audio permits silent bundling; the installer carries the
          # attribution page their licence requires. If this download fails the
          # installer still builds and points the user at vb-cable.com.
          New-Item -ItemType Directory -Force -Path packaging/windows/vbcable | Out-Null
          Invoke-WebRequest -Uri "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip" -OutFile vbcable.zip
          Expand-Archive vbcable.zip -DestinationPath packaging/windows/vbcable -Force
          Get-ChildItem packaging/windows/vbcable

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\wiremic.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: wiremic-windows-installer
          path: dist/*Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wiremic-windows-portable
          path: dist/app/*
          if-no-files-found: error

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wiremic-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
